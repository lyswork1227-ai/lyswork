services:
  - type: web
    name: palmmicro-live
    runtime: python
    buildCommand: pip install -r requirements-public.txt
    startCommand: uvicorn public_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PALMMICRO_PUBLISH_TOKEN
        generateValue: true
      - key: PALMMICRO_VIEW_TOKEN
        generateValue: true

