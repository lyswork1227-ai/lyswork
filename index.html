<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Palmmicro 实时数据</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111715; color: #e8efeb; }
    header { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between;
      align-items: center; gap: 20px; padding: 18px 24px; background: rgba(17,23,21,.94);
      border-bottom: 1px solid #2b3833; backdrop-filter: blur(12px); }
    h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
    #status { color: #ffbe5c; font-size: 14px; }
    #status.live { color: #56d894; }
    main { padding: 20px 24px 40px; overflow: auto; }
    .meta { display: flex; gap: 24px; margin-bottom: 14px; color: #96a8a0; font-size: 13px; }
    table { width: 100%; min-width: 980px; border-collapse: separate; border-spacing: 0;
      background: #17201d; border: 1px solid #2b3833; border-radius: 10px; overflow: hidden; }
    th, td { padding: 9px 11px; border-bottom: 1px solid #26312d; text-align: left; white-space: nowrap; }
    th { position: sticky; top: 61px; background: #202b27; color: #b8c8c1; font-size: 12px; }
    td { font-variant-numeric: tabular-nums; font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: #1d2824; }
    .negative { color: #ff7474; }
    dialog { border: 1px solid #34443d; border-radius: 12px; background: #17201d; color: #e8efeb;
      padding: 24px; box-shadow: 0 18px 60px rgba(0,0,0,.5); }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    form { display: grid; gap: 14px; min-width: min(360px, 80vw); }
    input, button { font: inherit; border-radius: 8px; padding: 11px 12px; }
    input { color: #fff; background: #0e1412; border: 1px solid #3a4b44; }
    button { border: 0; background: #56d894; color: #092117; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Palmmicro 实时数据</h1>
    <div id="status">等待连接</div>
  </header>
  <main>
    <div class="meta"><span id="updated">尚无数据</span><span id="count">0 行</span></div>
    <table>
      <thead id="head"></thead>
      <tbody id="body"></tbody>
    </table>
  </main>
  <dialog id="login">
    <form id="login-form">
      <strong>查看实时数据</strong>
      <span>请输入查看令牌。令牌只保存在当前浏览器标签页中。</span>
      <input id="token" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">连接</button>
    </form>
  </dialog>
  <script>
    const login = document.querySelector('#login');
    const form = document.querySelector('#login-form');
    const tokenInput = document.querySelector('#token');
    const statusEl = document.querySelector('#status');
    const updatedEl = document.querySelector('#updated');
    const countEl = document.querySelector('#count');
    const head = document.querySelector('#head');
    const body = document.querySelector('#body');
    let socket;
    let retry = 1000;
    let heartbeat;

    function setStatus(text, live = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle('live', live);
    }

    function render(message) {
      const rows = message.rows || [];
      const columns = rows.length ? Object.keys(rows[0]) : [];
      head.innerHTML = `<tr>${columns.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr>`;
      body.innerHTML = rows.map(row => `<tr>${columns.map(c => {
        const value = row[c] ?? '';
        const cls = c === 'Percent' && Number(value) < 0 ? 'negative' : '';
        const display = c === 'Percent' && value !== '' ? `${(Number(value) * 100).toFixed(2)}%` : value;
        return `<td class="${cls}">${escapeHtml(String(display))}</td>`;
      }).join('')}</tr>`).join('');
      updatedEl.textContent = `更新时间 ${new Date(message.sent_at).toLocaleString()}`;
      countEl.textContent = `${rows.length} 行`;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function connect() {
      const token = sessionStorage.getItem('palmmicro_view_token');
      if (!token) { login.showModal(); return; }
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/ws/view`);
      setStatus('正在连接');
      socket.onopen = () => socket.send(JSON.stringify({type: 'auth', role: 'viewer', token}));
      socket.onmessage = event => {
        const message = JSON.parse(event.data);
        if (message.type === 'ready') {
          retry = 1000;
          setStatus('实时连接', true);
          clearInterval(heartbeat);
          heartbeat = setInterval(() => socket.readyState === WebSocket.OPEN && socket.send('ping'), 20000);
        } else if (message.type === 'snapshot') {
          render(message);
        } else if (message.type === 'publisher_status' && !message.connected) {
          setStatus('内网数据源已断开');
        } else if (message.type === 'error') {
          sessionStorage.removeItem('palmmicro_view_token');
          socket.close();
          login.showModal();
        }
      };
      socket.onclose = () => {
        clearInterval(heartbeat);
        setStatus('连接中断，正在重连');
        setTimeout(connect, retry);
        retry = Math.min(retry * 2, 30000);
      };
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      sessionStorage.setItem('palmmicro_view_token', tokenInput.value);
      login.close();
      connect();
    });
    connect();
  </script>
</body>
</html>
