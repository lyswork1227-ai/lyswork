<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Palmmicro 实时数据</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "SF Pro Display", "Microsoft YaHei", system-ui, sans-serif;
      --page: #f3f7fb;
      --surface: #ffffff;
      --surface-strong: #f4f8f6;
      --line: rgba(30, 64, 90, .12);
      --line-strong: rgba(30, 64, 90, .20);
      --text: #172033;
      --muted: #64748b;
      --green: #0f9f6e;
      --green-soft: rgba(15, 159, 110, .10);
      --red: #d83a48;
      --red-soft: #fff2f3;
      --amber: #b7791f;
    }
    * { box-sizing: border-box; }
    html { background: var(--page); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 82% -12%, rgba(15, 159, 110, .12), transparent 34rem),
        linear-gradient(180deg, #fbfdff 0, #edf3f8 100%);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 4;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(18px);
    }
    .header-inner {
      width: min(100%, 1800px);
      min-height: 60px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(15, 159, 110, .24);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(15, 159, 110, .16), rgba(15, 159, 110, .04));
      color: var(--green);
      font-size: 15px;
      font-weight: 800;
      box-shadow: inset 0 1px rgba(255, 255, 255, .72);
    }
    h1 { margin: 0; font-size: 18px; line-height: 1.2; letter-spacing: .01em; }
    .brand-meta { display: flex; align-items: center; gap: 10px; }
    .subtitle { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .promo { margin: 2px 0 0; color: var(--red); font-size: 11px; font-weight: 700; }
    #status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 6px 10px;
      border: 1px solid rgba(183, 121, 31, .22);
      border-radius: 999px;
      background: rgba(183, 121, 31, .08);
      color: var(--amber);
      font-size: 12px;
      font-weight: 650;
    }
    #status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px rgba(183, 121, 31, .1);
    }
    #status.live {
      border-color: rgba(15, 159, 110, .22);
      background: var(--green-soft);
      color: var(--green);
    }
    #status.live::before {
      box-shadow: 0 0 0 4px rgba(15, 159, 110, .1);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      50% { box-shadow: 0 0 0 7px rgba(15, 159, 110, 0); }
    }
    main {
      width: min(100%, 1800px);
      margin: 0 auto;
      padding: 16px 24px 28px;
    }
    .overview {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 10px;
    }
    .overview h2 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: .01em;
    }
    .overview p { margin: 0; color: var(--muted); font-size: 12px; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .meta span {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .88);
      color: #475569;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .table-shell {
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 18px 48px rgba(30, 64, 90, .10), inset 0 1px rgba(255, 255, 255, .85);
    }
    .table-scroll { overflow: auto; scrollbar-color: #9fb3c8 #eef3f8; }
    table {
      width: 100%;
      min-width: 1160px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: auto;
    }
    th, td {
      height: 23px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      height: 22px;
      background: #edf7f2;
      color: #547064;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .025em;
      box-shadow: 0 1px var(--line-strong);
    }
    td {
      color: #1e293b;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      transition: background-color .15s ease, color .15s ease;
    }
    th:first-child, td:first-child { padding-left: 10px; }
    th:last-child, td:last-child { width: 100%; min-width: 360px; padding-right: 10px; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #f2faf6; }
    tbody tr.group-start:not(:first-child) td { border-top: 1px solid rgba(30, 64, 90, .15); }
    tbody tr.discount-row td {
      color: var(--red);
      background: var(--red-soft);
    }
    tbody tr.discount-row:hover td { background: #ffe8eb; }
    .empty {
      height: 200px;
      color: var(--muted);
      text-align: center;
    }
    dialog {
      width: min(420px, calc(100vw - 32px));
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      background: #ffffff;
      color: var(--text);
      padding: 28px;
      box-shadow: 0 24px 90px rgba(15, 23, 42, .24);
    }
    dialog::backdrop { background: rgba(15, 23, 42, .38); backdrop-filter: blur(5px); }
    form { display: grid; gap: 14px; }
    form strong { font-size: 19px; }
    form span { color: var(--muted); font-size: 13px; line-height: 1.7; }
    input, button {
      min-height: 44px;
      border-radius: 10px;
      padding: 0 13px;
      font: inherit;
    }
    input {
      outline: none;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      color: var(--text);
    }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(78, 214, 154, .1); }
    button {
      border: 0;
      background: var(--green);
      color: #ffffff;
      font-weight: 750;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.06); }
    @media (max-width: 720px) {
      .header-inner { min-height: 56px; padding: 0 14px; }
      .brand-mark { width: 28px; height: 28px; }
      h1 { font-size: 16px; }
      .subtitle { display: none; }
      #status { padding: 6px 9px; font-size: 11px; }
      main { padding: 14px 12px 24px; }
      .overview { align-items: flex-start; flex-direction: column; gap: 10px; }
      .meta { width: 100%; }
      .meta span { flex: 1 1 auto; justify-content: center; }
      .table-shell { border-radius: 10px; }
      th, td { height: 28px; padding: 0 8px; }
      th { height: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">P</div>
        <div>
          <h1>Palmmicro 实时数据</h1>
          <div class="brand-meta">
            <p class="subtitle">跨市场对冲监控</p>
            <p class="promo">跟着无敌哥学套利，年入百万不是梦</p>
          </div>
        </div>
      </div>
      <div id="status" role="status" aria-live="polite">等待连接</div>
    </div>
  </header>
  <main>
    <section class="overview" aria-label="数据概览">
      <div>
        <h2>行情明细</h2>
        <p>数据自动刷新，折价记录以红色标识</p>
      </div>
      <div class="meta">
        <span id="updated">尚无数据</span>
        <span id="count">0 行</span>
      </div>
    </section>
    <div class="table-shell">
      <div class="table-scroll">
        <table>
          <thead id="head"></thead>
          <tbody id="body"><tr><td class="empty">等待实时数据</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
  <dialog id="login">
    <form id="login-form">
      <strong>查看实时数据</strong>
      <span>请输入查看令牌。令牌只保存在当前浏览器标签页中。</span>
      <input id="token" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">连接</button>
    </form>
  </dialog>
  <script>
    const login = document.querySelector('#login');
    const form = document.querySelector('#login-form');
    const tokenInput = document.querySelector('#token');
    const statusEl = document.querySelector('#status');
    const updatedEl = document.querySelector('#updated');
    const countEl = document.querySelector('#count');
    const head = document.querySelector('#head');
    const body = document.querySelector('#body');
    let socket;
    let retry = 1000;
    let heartbeat;
    let publisherConnected = false;

    function setStatus(text, live = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle('live', live);
    }

    function premiumValue(value) {
      if (typeof value === 'number') return value;
      if (typeof value !== 'string') return NaN;
      return Number.parseFloat(value.replace(/,/g, '').trim());
    }

    function isPremiumColumn(column) {
      return column === '溢价' || column === 'Percent' || column === 'percent';
    }

    function render(message) {
      const rows = message.rows || [];
      const columns = rows.length ? Object.keys(rows[0]) : [];
      head.innerHTML = `<tr>${columns.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr>`;
      body.innerHTML = rows.length ? rows.map(row => {
        const premiumColumn = columns.find(isPremiumColumn);
        const isDiscount = premiumColumn && premiumValue(row[premiumColumn]) < 0;
        const isGroupStart = row['代码'] || row.Symbol || row.symbol;
        const rowClasses = [
          isDiscount ? 'discount-row' : '',
          isGroupStart ? 'group-start' : ''
        ].filter(Boolean).join(' ');
        return `<tr class="${rowClasses}">${columns.map(c => {
        const value = row[c] ?? '';
        const display = c === 'Percent' && typeof value === 'number' && value !== ''
          ? `${(value * 100).toFixed(2)}%`
          : value;
        return `<td>${escapeHtml(String(display))}</td>`;
      }).join('')}</tr>`;
      }).join('') : `<tr><td class="empty" colspan="${Math.max(columns.length, 1)}">暂无实时数据</td></tr>`;
      updatedEl.textContent = `更新时间 ${new Date(message.sent_at).toLocaleString()}`;
      countEl.textContent = `${rows.length} 行`;
      publisherConnected = true;
      setStatus('实时连接', true);
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function connect() {
      const token = sessionStorage.getItem('palmmicro_view_token');
      if (!token) { login.showModal(); return; }
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/ws/view`);
      setStatus('正在连接');
      socket.onopen = () => socket.send(JSON.stringify({type: 'auth', role: 'viewer', token}));
      socket.onmessage = event => {
        const message = JSON.parse(event.data);
        if (message.type === 'ready') {
          retry = 1000;
          setStatus('公网已连接，等待内网数据源');
          clearInterval(heartbeat);
          heartbeat = setInterval(() => socket.readyState === WebSocket.OPEN && socket.send('ping'), 20000);
        } else if (message.type === 'snapshot') {
          render(message);
        } else if (message.type === 'publisher_status') {
          publisherConnected = Boolean(message.connected);
          setStatus(
            publisherConnected ? '内网数据源已连接，等待数据' : '内网数据源已断开',
            publisherConnected
          );
        } else if (message.type === 'error') {
          sessionStorage.removeItem('palmmicro_view_token');
          socket.close();
          login.showModal();
        }
      };
      socket.onclose = () => {
        clearInterval(heartbeat);
        setStatus('连接中断，正在重连');
        setTimeout(connect, retry);
        retry = Math.min(retry * 2, 30000);
      };
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      sessionStorage.setItem('palmmicro_view_token', tokenInput.value);
      login.close();
      connect();
    });
    connect();
  </script>
</body>
</html>
